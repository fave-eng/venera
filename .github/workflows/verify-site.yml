name: 0 - Verify Venera website
on:
  workflow_dispatch:
  push:
    paths:
      - 'app.js'
      - 'config.js'
      - 'data/**'
      - 'scripts/**'
      - 'tests/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/site-integrity.mjs
